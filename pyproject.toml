[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-nim-agent"
version = "0.1.0"
description = "Enterprise support runtime with NVIDIA NIM, LangGraph, scoped RAG and durable approval"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1", "pydantic-settings>=2.8,<3",
  "langgraph>=1.0,<2", "numpy>=2.2,<3",
  "qdrant-client>=1.14,<2", "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "PyYAML>=6,<7", "setuptools>=75", "wheel>=0.45,<1"]

[tool.setuptools.packages.find]
include = ["app*", "evals*", "benchmarks*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
