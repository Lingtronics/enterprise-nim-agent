# Source: enterprise-nim-agent/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-agent-enterprise-nim-agent-qdrant-private
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-nim-agent
      app.kubernetes.io/instance: enterprise-agent
      app.kubernetes.io/component: qdrant
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-nim-agent
              app.kubernetes.io/instance: enterprise-agent
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 6333

---
# Source: enterprise-nim-agent/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-agent-enterprise-nim-agent-config
  namespace: default
data:
  MODEL_MODE: "demo"
  NIM_BASE_URL: "https://integrate.api.nvidia.com/v1"
  NIM_MODEL: "meta/llama-3.1-8b-instruct"
  NIM_TIMEOUT_SECONDS: "30"
  NIM_MAX_RETRIES: "2"
  FALLBACK_ENABLED: "true"
  DATABASE_PATH: /app/data/runtime.db
  CORPUS_PATH: /app/sample_data
  VECTOR_BACKEND: qdrant
  QDRANT_URL: "http://enterprise-agent-enterprise-nim-agent-qdrant:6333"
  RETRIEVAL_TOP_K: "6"
  CHUNK_SIZE: "800"
  CHUNK_OVERLAP: "100"
  LOG_LEVEL: INFO
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

