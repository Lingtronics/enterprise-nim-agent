apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: enterprise-agent-state
  namespace: enterprise-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: enterprise-qdrant-data
  namespace: enterprise-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
