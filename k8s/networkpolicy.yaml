apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-qdrant-private
  namespace: enterprise-agent
spec:
  podSelector:
    matchLabels:
      app: enterprise-qdrant
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: enterprise-agent
      ports:
        - protocol: TCP
          port: 6333
